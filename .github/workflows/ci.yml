name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DAAS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/daas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Migrations apply cleanly
        env:
          DAAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/daas_test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/daas_test -c "drop schema public cascade; create schema public;"
          daas migrate
