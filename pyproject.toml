[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daas"
version = "0.1.0"
description = "New-business lead intelligence: state filings in, scored B2B leads out via a metered subscription API."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "pydantic[email]>=2.6",
  "httpx>=0.27",
  "stripe>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daas = "daas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
